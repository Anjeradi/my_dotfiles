# Heredar el directorio actual al crear ventanas y paneles
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
setw -g mode-keys vi

# Copiar al portapapeles del sistema con y
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# Copiar también al portapapeles al seleccionar texto con el ratón
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# Navegacion entre paneles con hjkl (estilo Vim/Neovim)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Increase scrollback history
set -g history-limit 50000
